name: Image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-tests:
    name: Host-only checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check the shell scripts parse
        run: |
          for f in flash.sh make-images.sh build/reproduce.sh build/cache-keys.sh \
                   run.sh new-files/toplevel/apply-local-changes.sh \
                   paperboard/tests/run.sh; do
            sh -n "$f" 2>/dev/null || bash -n "$f"
          done

      - name: Check the Python parses
        run: |
          for f in build/*.py experiments/mmu-poc/programs/*.py \
                   paperboard/tools/*.py paperboard/tests/*.py; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"
          done

      - name: Flasher regression tests
        run: python3 build/test-flash.py

      - name: Shell fallback tests
        run: python3 build/test-shell-fallback.py

      - name: Paperboard console tests
        run: |
          # Old clang ASan cannot start with the runners' high-entropy ASLR.
          sudo sysctl vm.mmap_rnd_bits=28 || true
          CC=$(command -v clang-18 || command -v clang) bash paperboard/tests/run.sh

  build:
    name: Full image ${{ matrix.run }}
    needs: host-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]

    env:
      # A fixed work directory lets the cache steps below restore a previous
      # run's completed stages. On a miss the stage is rebuilt from source,
      # exactly as a local reproduce.sh run would.
      REPRODUCE_DIR: ${{ github.workspace }}/build-output/reproduce.ci

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Give git an identity
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          test -n "$(git config user.name)"
          test -n "$(git config user.email)"

      # Each cache below carries one stage's outputs plus its done-marker.
      # container-build.sh skips a stage whose marker is present, so a hit
      # resumes the pipeline where the inputs did not change, and a miss
      # rebuilds the stage exactly as before. build/cache-keys.sh hashes
      # every file a stage reads straight from HEAD -- see that script
      # before adding a file to a stage. The caches deliberately have no
      # restore-keys: resuming a stage from a partial match could mix
      # outputs from changed inputs. The Buildroot download mirror and the
      # ESP-IDF tool install are not cached either: they are gigabytes for
      # a minute or two saved only when a stage actually rebuilds.

      - name: Compute the cache keys
        id: keys
        run: bash build/cache-keys.sh >> "$GITHUB_OUTPUT"

      - name: Restore the toolchain cache
        uses: actions/cache@v6
        with:
          path: |
            build-output/reproduce.ci/refs/esp32-linux-build/build/crosstool-NG/.config
            build-output/reproduce.ci/refs/esp32-linux-build/build/crosstool-NG/builds
            build-output/reproduce.ci/refs/esp32-linux-build/build/xtensa-dynconfig
            build-output/reproduce.ci/refs/esp32-linux-build/build/esp32s3
            build-output/reproduce.ci/stages/toolchain.done
          key: toolchain-${{ steps.keys.outputs.toolchain }}

      - name: Restore the rootfs cache
        uses: actions/cache@v6
        with:
          path: |
            build-output/reproduce.ci/refs/esp32-linux-build/build/build-buildroot-esp32s3_devkit_c1_16m
            build-output/reproduce.ci/stages/base-rootfs.done
          key: rootfs-${{ steps.keys.outputs.rootfs }}

      - name: Restore the firmware cache
        uses: actions/cache@v6
        with:
          path: |
            build-output/reproduce.ci/refs/esp32-linux-build/build/esp-hosted
            build-output/reproduce.ci/base-images
            build-output/reproduce.ci/Linux-on-esp32-S3/images
            build-output/reproduce.ci/stages/firmware.done
          key: firmware-${{ steps.keys.outputs.firmware }}

      - name: Restore the userspace cache
        uses: actions/cache@v6
        with:
          path: |
            build-output/reproduce.ci/Linux-on-esp32-S3/experiments/mmu-poc/out
            build-output/reproduce.ci/artifacts/rootfs.cramfs
            build-output/reproduce.ci/artifacts/rootfs.json
            build-output/reproduce.ci/stages/userspace.done
          key: userspace-${{ steps.keys.outputs.userspace }}

      - name: Build everything from pinned sources
        run: JOBS=$(nproc) bash build/reproduce.sh

      - name: Report the cache directory sizes
        if: always()
        run: |
          # The four cached sets, so their sizes can be summed at a glance.
          for d in \
              build-output/reproduce.ci/refs/esp32-linux-build/build/crosstool-NG/.config \
              build-output/reproduce.ci/refs/esp32-linux-build/build/crosstool-NG/builds \
              build-output/reproduce.ci/refs/esp32-linux-build/build/xtensa-dynconfig \
              build-output/reproduce.ci/refs/esp32-linux-build/build/esp32s3 \
              build-output/reproduce.ci/refs/esp32-linux-build/build/build-buildroot-esp32s3_devkit_c1_16m \
              build-output/reproduce.ci/refs/esp32-linux-build/build/esp-hosted \
              build-output/reproduce.ci/base-images \
              build-output/reproduce.ci/Linux-on-esp32-S3/images \
              build-output/reproduce.ci/Linux-on-esp32-S3/experiments/mmu-poc/out \
              build-output/reproduce.ci/artifacts \
              build-output/reproduce.ci/stages; do
            if [ -e "$d" ]; then
              du -sh "$d"
            else
              echo "missing  $d"
            fi
          done

      - name: Report the disk left
        if: always()
        run: df -h /

      - name: Locate the artifacts
        id: out
        run: |
          dir=$(ls -dt build-output/reproduce.*/artifacts | head -1)

          test -d "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Verify the checksums
        working-directory: ${{ steps.out.outputs.dir }}
        run: sha256sum -c SHA256SUMS

      - name: Report what was built
        run: |
          {
            echo "## Build ${{ matrix.run }}"
            echo
            echo "Source commit \`${{ github.sha }}\`. Board verification stays"
            echo "pending: this runner has no hardware attached."
            echo
            echo '```'
            cat "${{ steps.out.outputs.dir }}/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the images
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.run }}
          path: ${{ steps.out.outputs.dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.run }}
          path: build-output/reproduce.*/logs/
          if-no-files-found: warn
          retention-days: 14

  compare:
    name: Compare the two builds
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download the first build
        uses: actions/download-artifact@v8
        with:
          name: image-1
          path: left/artifacts

      - name: Download the second build
        uses: actions/download-artifact@v8
        with:
          name: image-2
          path: right/artifacts

      - name: Compare every artifact
        run: python3 build/compare-builds.py left right --output comparison.json

      - name: Summarise the differences
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path('comparison.json')
          if not path.exists():
              print('## Reproducibility\n\nThe comparison did not produce a report.')
              raise SystemExit(0)
          report = json.loads(path.read_text())
          print('## Reproducibility\n')
          print('Same source commit:', report['same_source_commit'], '\n')
          print('| artifact | result |')
          print('|---|---|')
          for name, entry in report['artifacts'].items():
              print(f"| `{name}` | {'identical' if entry['identical'] else 'differs'} |")
          differences = sorted(report['rootfs_differences'])
          print('\nRootfs entries that differ:',
                ', '.join(f'`{name}`' for name in differences) if differences else 'none')
          PY

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comparison
          path: comparison.json
          if-no-files-found: warn
